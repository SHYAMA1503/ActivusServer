name: Java CI & Deploy to Azure

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# --- Jobs: Build and Deploy ---
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # Set up Java 17 (from your original file)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    # Build with Maven (creates target/*.jar)
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    
    # **NEW STEP 1: Upload the compiled JAR artifact**
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-app
        path: target/*.jar # Upload the JAR file from the target directory
  
  deploy:
    # This job runs only after the 'build' job is complete
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    # **NEW STEP 2: Download the compiled JAR artifact**
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: spring-boot-app
        
    # **NEW STEP 3: Deploy to Azure App Service**
    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'Activus' # REPLACE with your App Service name
        slot-name: 'Production'
        # This secret must be set in your GitHub repository settings
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} 
        # Since we downloaded the JAR artifact, the path is simply the JAR file name
        package: '*.jar'
