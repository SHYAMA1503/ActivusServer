spring.application.name=iTDS

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/iTDS?currentSchema=tds
spring.datasource.username=postgres
spring.datasource.password=Admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hibernate Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Other JPA properties
spring.jpa.properties.hibernate.auto_quote_keyword=true
# Hibernate Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



# Enable SQL Initialization
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.sql.init.schema-locations=classpath:db/1-create_table.sql
#spring.sql.init.data-locations=classpath:db/2-Insert_table.sql

file.storage.path=${java.io.tmpdir}/TDS_Temp